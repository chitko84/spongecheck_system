/* =======================================================================
   SPONGECHECK PHASE 2 • Crimson Current editorial experience
   Design system extensions preserve all Phase 1 interactions.
   ======================================================================= */
:root{--rose:#A85A77;--copper:#D5A47D;--berry:#5B1E35;--deep:#172333}
::selection{background:#9D5875;color:#fff}
/* A real skippable intro, shown only at the very first public visit */
.splash-stage{position:fixed;inset:0;z-index:1000;background:radial-gradient(circle at 50% 68%,#7b4458 0%,#401d32 41%,#152334 100%);display:grid;place-items:center;color:#fff;isolation:isolate;animation:splashOut .68s 1.4s forwards}
.splash-stage .brand-lockup{color:#fff;font-size:clamp(28px,5vw,49px);letter-spacing:-.07em}
.splash-stage .brand-symbol{width:57px;height:57px;background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.2);color:white}
.splash-stage .brand-symbol svg{width:28px;height:28px}
.splash-content{display:grid;justify-items:center;gap:17px;animation:riseIn .85s both}
.splash-content p{font-size:13px;color:#e1bdcb;letter-spacing:.13em;font-weight:600}
.splash-orbit{position:absolute;top:50%;left:50%;width:160px;height:160px;border-radius:50%;border:1px solid rgba(246,206,216,.29);transform:translate(-50%,-50%);animation:splashOrbit 1.8s ease-out both}
.splash-orbit-two{animation-delay:.17s}
.splash-skip{position:absolute;right:clamp(20px,5vw,70px);bottom:30px;border:1px solid rgba(255,255,255,.4);color:white;background:rgba(255,255,255,.07);padding:12px 18px;border-radius:999px;display:flex;align-items:center;gap:10px;z-index:2}
@keyframes splashOrbit{from{opacity:0;width:40px;height:40px}to{opacity:.45;width:660px;height:660px}}
@keyframes splashOut{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
/* Landing hero — editorial layout and inset preview card */
.landing-phase2{overflow:hidden}
.hero-phase2{min-height:645px;height:clamp(645px,54vw,790px);border-radius:30px;align-items:center;box-shadow:0 32px 70px rgba(65,25,48,.12)}

(2,minmax(0,1fr));gap:9px}.place-type-card{padding:12px 10px;min-height:92px;border-radius:15px;gap:8px}.place-type-card>svg{display:none}.place-type-card strong{font-size:11px}.place-type-card small{font-size:10px}.place-type-icon{width:34px;height:34px;flex-basis:34px;border-radius:9px}.place-type-icon svg{width:18px;height:18px}}

/* === Phase 3: mobile-first, three-step photographic inspection === */
.inspection-page{max-width:1160px;margin:0 auto}
.inspection-notice{display:flex;align-items:flex-start;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:13px 16px;color:var(--muted);font-size:13px;line-height:1.5;margin:0 0 18px}

.inspection-progress{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin:0 0 22px;counter-reset:step}
.inspection-stage{display:flex;align-items:center;gap:9px;position:relative;min-width:0;color:var(--muted);background:var(--surface);border:1px solid var(--border);border-radius:15px;padding:11px 12px;transition:background .2s,color .2s,border-color .2s}
.inspection-stage.current{background:#F9EAEE;border-color:#A66A7F;color:#5B1E35}
.inspection-stage.done{border-color:#B6CEBD;color:#326342}
.inspection-stage>span{width:28px;height:28px;flex:0 0 28px;display:grid;place-items:center;border-radius:50%;background:var(--soft,#f1eceb);color:inherit;font-size:12px;font-weight:800}
.inspection-stage.current>span{background:#5B1E35;color:white}.inspection-stage.done>span{background:#E3F1E8;color:#257148}
.inspection-stage>small{font-size:12px;font-weight:700;line-height:1.25;min-width:0}
.inspection-layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(240px,.82fr);align-items:start;gap:20px}
.inspection-form{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:clamp(20px,3vw,34px);min-width:0;box-shadow:var(--shadow)}
.inspection-step-content>.eyebrow{display:block;margin-bottom:9px}
.inspection-step-content>h2{font-size:clamp(25px,2.5vw,35px);letter-spacing:-.042em;line-height:1.2;margin:0 0 9px}
.inspection-step-content>p{color:var(--muted);line-height:1.6;font-size:14px;margin:0 0 22px}
.inspection-form .field-label{display:block;margin:19px 0 9px;font-size:13px;font-weight:800}
.inspection-form .form-control{width:100%;min-height:50px}
.selected-place-preview{margin-top:12px;display:flex;align-items:center;gap:12px;border-radius:14px;background:var(--bg,#faf7f5);border:1px solid var(--border);padding:9px 11px}
.selected-place-preview .place-photo{width:64px;height:57px;object-fit:cover;border-radius:10px;flex:0 0 64px}
.selected-place-preview>div{min-width:0;display:grid;gap:5px}.selected-place-preview strong{font-size:14px}.selected-place-preview span{font-size:12px;color:var(--muted)}
.inspection-upload{height:230px;position:relative;overflow:hidden;border:2px dashed #B68C9B;border-radius:19px;background:linear-gradient(145deg,#FCF2F4,#F3E5E7);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:11px;color:#5B1E35;cursor:pointer;text-align:center;padding:15px;transition:border-color .15s,background .15s}
.inspection-upload:hover{border-color:#68243e;background:#F9EAED}.inspection-upload:focus-within{outline:2px solid #5B1E35;outline-offset:3px}
.inspection-upload>strong{font-size:15px}.inspection-upload>span{font-size:12px;color:#765967}
.inspection-upload.has-image{border:1px solid var(--border);padding:0;background:var(--bg)}.inspection-upload img{width:100%;height:100%;object-fit:cover}
.image-actions{display:flex;justify-content:space-between;gap:9px;align-items:center;padding:12px 2px}.image-actions>span{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);overflow-wrap:anywhere;min-width:0}.image-actions .quiet-link{flex:0 0 auto}
.example-photo-option{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:17px 18px;margin-top:16px;background:var(--bg);border:1px solid var(--border);border-radius:16px}
.example-photo-option strong{font-size:14px}.example-photo-option p{color:var(--muted);font-size:12px;margin:5px 0 0;line-height:1.5}.example-photo-option .btn{flex:0 0 auto;font-size:12px;padding:11px 12px;white-space:nowrap}
.sample-warning{display:flex;align-items:flex-start;gap:9px;font-size:12px;color:#836138;background:#FFF7E9;border:1px solid #F1DFBE;padding:13px;border-radius:12px;line-height:1.5;margin-top:14px}.sample-warning svg{flex:0 0 17px}
.inspection-small-preview{display:flex;align-items:center;gap:14px;background:var(--bg);border:1px solid var(--border);padding:10px;border-radius:16px;margin-bottom:15px}.inspection-small-preview img{width:110px;height:94px;border-radius:10px;object-fit:cover;flex:0 0 110px}.inspection-small-preview>div{display:grid;gap:7px;min-width:0}.inspection-small-preview strong{font-size:14px}.inspection-small-preview span{font-size:12px;line-height:1.45;color:var(--muted);overflow-wrap:anywhere}
.analysis-banner{display:flex;align-items:flex-start;gap:12px;padding:17px;background:#F8EEF1;border:1px solid #EAD0DA;border-radius:16px;margin:0 0 20px;color:#5B1E35}.analysis-banner.manual{background:#EDF3F8;border-color:#D3E1EE;color:#234B6C}.analysis-banner svg{flex:0 0 21px}.analysis-banner strong{font-size:14px}.analysis-banner p{font-size:12px;line-height:1.65;margin:6px 0 0;color:inherit}
.observation-fields{display:grid;gap:6px}.observation-fields>div{padding-bottom:4px}

.inspection-form textarea.report-textarea{min-height:154px;resize:vertical;padding:14px}
.inspection-form .field-hint{display:block;margin-top:8px;color:var(--muted)}
.review-disclaimer{display:flex;align-items:flex-start;gap:10px;font-size:12px;color:var(--muted);line-height:1.6;margin-top:22px}.review-disclaimer svg{flex:0 0 17px;margin-top:1px}
.inspection-actions{display:flex;justify-content:space-between;gap:11px;border-top:1px solid var(--border);margin-top:25px;padding-top:21px}.inspection-actions .btn{min-height:48px;display:flex;justify-content:center;align-items:center;gap:9px}

.field-error{color:#A32843;font-size:13px;font-weight:700;line-height:1.5;margin:11px 0 0}.inspection-error{padding:12px 14px;background:#FEEDF0;border:1px solid #F4C3CF;border-radius:12px}

.inspection-aside{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:17px;overflow:hidden}
.inspection-aside-media{height:190px;border-radius:17px;overflow:hidden;margin-bottom:21px}.inspection-aside-media img{width:100%;height:100%;object-fit:cover}
.inspection-aside .eyebrow{display:block;margin-bottom:9px}.inspection-aside h3{font-size:24px;letter-spacing:-.035em;line-height:1.2;margin:0 0 13px}.inspection-aside>p{font-size:13px;line-height:1.7;color:var(--muted);margin:0 0 22px}

.case-findings,.case-history{margin:16px 0;border:1px solid var(--border);border-radius:17px;padding:20px;background:var(--surface)}
.case-findings h3,.case-history h3{font-size:19px;margin:8px 0 16px}
.case-observation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.case-observation-grid>div{background:var(--bg);padding:13px;border-radius:11px;display:grid;gap:8px}.case-observation-grid span{font-size:11px;color:var(--muted)}.case-observation-grid strong{font-size:13px}
